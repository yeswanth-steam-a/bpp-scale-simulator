# Milestone: 50,000 connected chargers (100,000 connectors) with parallel sessions stepping 5,000 -> 10,000 -> 15,000 -> 22,000.
# ~10-minute sessions, so each step's start rate is level/10 per minute (500, 1,000, 1,500, 2,200/min = up to ~37 starts/s
# plus as many stops). Each step lasts 12 min (parallel reaches the level after ~10 min); 22,000 is held for the last two
# slots (~14 min at 22k). Sessions are spread evenly over the four charger types (same as the 10k run).
# Purpose: find where today's stack breaks at this churn. Expect the limit before 22,000 (BFF 8 s stop sleep,
# 1,000 account-wide Lambda limit, 400 OCPP threads, 3,000 gp3 IOPS).
# Needs: LT-000001..LT-050000 (all of them: chargers: 50000 matches the seed's type blocks, no ids_file),
# tags LTTAG000001..LTTAG030000. One load generator: ulimit -n 65535, wide source port range, run in tmux.
target: ws://bp-sim.iris-cms.com:9888/csms/
chargers: 50000
id_prefix: "LT-"
duration: 60m                 # 5 slots x 12 min
time_scale: 1
seed: 22000
connect_rate: 100            # 50,000 chargers in ~8.5 min
reconnect_min: 2s
reconnect_max: 60s
call_timeout: 60s
warmup: 5m
metrics_addr: ":2112"
summary_file: "results/steps-50k-22k.json"

sessions:
  total: 88800                # 12 min x (500 + 1,000 + 1,500 + 2,200 + 2,200) per min
  curve: [500, 1000, 1500, 2200, 2200]

idtags:
  prefix: "LTTAG"
  pool: 30000                 # 22,000 busy at the peak plus spare
  invalid_pct: 0

noise:
  disconnects_per_charger_per_day: 0.3
  faults_per_charger_per_day: 0.1
  fault_min: 2m
  fault_max: 20m

profiles:
  - {name: ac-7kw,   share: 0.45, vendor: LoadSim, model: AC-7,   connectors: 2, max_power_w: 7400,   voltage: 230, meter_interval: 60s, session_mean: 10m, session_sigma: 0.15, session_min: 7m, session_max: 13m, session_weight: 1}
  - {name: ac-22kw,  share: 0.30, vendor: LoadSim, model: AC-22,  connectors: 2, max_power_w: 22000,  voltage: 230, meter_interval: 60s, session_mean: 10m, session_sigma: 0.15, session_min: 7m, session_max: 13m, session_weight: 1}
  - {name: dc-60kw,  share: 0.17, vendor: LoadSim, model: DC-60,  connectors: 2, max_power_w: 60000,  voltage: 400, meter_interval: 30s, session_mean: 10m, session_sigma: 0.15, session_min: 7m, session_max: 13m, session_weight: 1}
  - {name: dc-150kw, share: 0.08, vendor: LoadSim, model: DC-150, connectors: 2, max_power_w: 150000, voltage: 600, meter_interval: 30s, session_mean: 10m, session_sigma: 0.15, session_min: 7m, session_max: 13m, session_weight: 1}
