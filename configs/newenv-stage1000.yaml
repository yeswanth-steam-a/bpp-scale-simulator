# Staged runs against the new environment. Override size with flags: -chargers N (sessions.total is set to match via -sessions in this file; edit per stage).
target: ws://bp-sim.iris-cms.com:9888/csms/
chargers: 1000
id_prefix: "LT-"                 # LT-000001 ...
duration: 1m                     # session starts are spread over this window
time_scale: 1
seed: 1000
connect_rate: 50
reconnect_min: 2s
reconnect_max: 60s
call_timeout: 60s
metrics_addr: ""
summary_file: "results/newenv-stage1000.json"
sessions:
  total: 1000
  curve: [1]
idtags:
  prefix: "LTTAG"                # LTTAG000001 ...
  pool: 1000
  invalid_pct: 0
noise: {disconnects_per_charger_per_day: 0, faults_per_charger_per_day: 0}
profiles:
  - {name: ac-7kw, share: 1, vendor: LoadSim, model: AC-7, connectors: 1, max_power_w: 7400, voltage: 230, meter_interval: 30s, session_mean: 3m, session_sigma: 0.02, session_min: 170s, session_max: 190s, session_weight: 1}
