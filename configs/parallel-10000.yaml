# 10,000 real parallel sessions (low churn) on 25,000 chargers (38,750 connectors, ~26% busy at the peak).
# Sessions of ~30 minutes start at a steady ~333/min for 50 minutes: parallel sessions climb to ~10,000 by minute ~30
# and hold there for ~20 minutes, then the last ones finish. MeterValues every 60 s (AC) / 30 s (DC) throughout.
# Total ~1 h 40 min: ~4 min connect, 5 min idle, 50 min of starts, up to 40 min for the last sessions to finish.
# Chargers come from configs/mix-25000-ids.txt: real seeded ids of each type block, in profile order
# (11,250 AC 7 kW, 7,500 AC 22 kW, 4,250 DC 60 kW, 2,000 DC 150 kW). Tags LTTAG000001..LTTAG015000.
# Run from inside AWS: ulimit -n 65535 and a wide source port range (README).
target: ws://bp-sim.iris-cms.com:9888/csms/
chargers: 25000
ids_file: "configs/mix-25000-ids.txt"
id_prefix: "LT-"
duration: 50m
time_scale: 1
seed: 10000
connect_rate: 100            # 25,000 chargers in ~4 min
reconnect_min: 2s
reconnect_max: 60s
call_timeout: 60s
warmup: 5m
metrics_addr: ":2112"
summary_file: "results/parallel-10000.json"

sessions:
  total: 16700                # ~333 starts/min x 50 min; with ~30 min sessions this holds ~10,000 in parallel
  curve: [1]                  # flat start rate

idtags:
  prefix: "LTTAG"
  pool: 15000                 # 10,000 busy at the peak plus spare
  invalid_pct: 0

noise:
  disconnects_per_charger_per_day: 0.3
  faults_per_charger_per_day: 0.1
  fault_min: 2m
  fault_max: 20m

profiles:
  - {name: ac-7kw,   share: 0.45, vendor: LoadSim, model: AC-7,   connectors: 1, max_power_w: 7400,   voltage: 230, meter_interval: 60s, session_mean: 30m, session_sigma: 0.15, session_min: 20m, session_max: 40m, session_weight: 1}
  - {name: ac-22kw,  share: 0.30, vendor: LoadSim, model: AC-22,  connectors: 2, max_power_w: 22000,  voltage: 230, meter_interval: 60s, session_mean: 30m, session_sigma: 0.15, session_min: 20m, session_max: 40m, session_weight: 1}
  - {name: dc-60kw,  share: 0.17, vendor: LoadSim, model: DC-60,  connectors: 2, max_power_w: 60000,  voltage: 400, meter_interval: 30s, session_mean: 30m, session_sigma: 0.15, session_min: 20m, session_max: 40m, session_weight: 1}
  - {name: dc-150kw, share: 0.08, vendor: LoadSim, model: DC-150, connectors: 2, max_power_w: 150000, voltage: 600, meter_interval: 30s, session_mean: 30m, session_sigma: 0.15, session_min: 20m, session_max: 40m, session_weight: 1}
