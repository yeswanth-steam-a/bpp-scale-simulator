# Idle connect test: 10,000 chargers (LT-000001..LT-010000) connect at 20/s, then idle 5 minutes
# (heartbeats and status only, one token session at the end). Finds the connected-charger ceiling.
# Run it from inside AWS: a home or office router's connection table can cap out first.
target: ws://bp-sim.iris-cms.com:9888/csms/
chargers: 10000
id_prefix: "LT-"
duration: 1m
time_scale: 1
seed: 500
connect_rate: 20
reconnect_min: 2s
reconnect_max: 60s
call_timeout: 60s
warmup: 5m
metrics_addr: ":2112"
summary_file: "results/connect-10000-ec2.json"

sessions:
  # sessions per step = parallel target x (6 min / 3 min): 200 + 500 + 1000
  total: 1
  curve: [100, 250, 500]        # one slot per step: start rate proportional to the parallel target

idtags:
  prefix: "LTTAG"
  pool: 4000                  # more than the 1,000 peak, so a tag is always free
  invalid_pct: 0

noise:
  disconnects_per_charger_per_day: 0.3
  faults_per_charger_per_day: 0.1
  fault_min: 2m
  fault_max: 20m

profiles:
  - {name: ac-7kw, share: 1, vendor: LoadSim, model: AC-7, connectors: 1, max_power_w: 7400, voltage: 230, meter_interval: 30s, session_mean: 3m, session_sigma: 0.1, session_min: 2m, session_max: 4m, session_weight: 1}
