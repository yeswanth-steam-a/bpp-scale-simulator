# Milestone retry (~60 min): 50,000 connected chargers (100,000 connectors), sessions stepping 10,000 -> 15,000 -> 22,000.
# ~10-minute sessions; start rates 1,000 / 1,500 / 2,200 per minute (up to ~37 starts/s plus as many stops).
# Steps are 12 / 12 / 20 minutes (4-minute curve slots); parallel reaches each level ~10 min into its step, so 22,000
# holds for ~10 min at the end. Chargers connect at 200/s (~4 min), then 2 minutes idle. Sessions spread evenly over the
# four charger types. Run after the BFF's 8 s stop delay was removed (2026-10-03 22:13 IST).
target: ws://bp-sim.iris-cms.com:9888/csms/
chargers: 50000
id_prefix: "LT-"
duration: 44m                 # 11 slots x 4 min: 3 at 10k, 3 at 15k, 5 at 22k
time_scale: 1
seed: 22060
connect_rate: 200            # 50,000 chargers in ~4 min (proven: 0 failures)
reconnect_min: 2s
reconnect_max: 60s
call_timeout: 60s
warmup: 2m
metrics_addr: ":2112"
summary_file: "results/steps-50k-22k-short.json"

sessions:
  total: 74000                # 4 min x (3x1,000 + 3x1,500 + 5x2,200) per min
  curve: [1000, 1000, 1000, 1500, 1500, 1500, 2200, 2200, 2200, 2200, 2200]

idtags:
  prefix: "LTTAG"
  pool: 30000                 # 22,000 busy at the peak plus spare
  invalid_pct: 0

noise:
  disconnects_per_charger_per_day: 0.3
  faults_per_charger_per_day: 0.1
  fault_min: 2m
  fault_max: 20m

profiles:
  - {name: ac-7kw,   share: 0.45, vendor: LoadSim, model: AC-7,   connectors: 2, max_power_w: 7400,   voltage: 230, meter_interval: 60s, session_mean: 10m, session_sigma: 0.15, session_min: 7m, session_max: 13m, session_weight: 1}
  - {name: ac-22kw,  share: 0.30, vendor: LoadSim, model: AC-22,  connectors: 2, max_power_w: 22000,  voltage: 230, meter_interval: 60s, session_mean: 10m, session_sigma: 0.15, session_min: 7m, session_max: 13m, session_weight: 1}
  - {name: dc-60kw,  share: 0.17, vendor: LoadSim, model: DC-60,  connectors: 2, max_power_w: 60000,  voltage: 400, meter_interval: 30s, session_mean: 10m, session_sigma: 0.15, session_min: 7m, session_max: 13m, session_weight: 1}
  - {name: dc-150kw, share: 0.08, vendor: LoadSim, model: DC-150, connectors: 2, max_power_w: 150000, voltage: 600, meter_interval: 30s, session_mean: 10m, session_sigma: 0.15, session_min: 7m, session_max: 13m, session_weight: 1}
